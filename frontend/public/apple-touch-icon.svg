<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF5722;stop-opacity:1" />
    </linearGradient>

    <!-- 텍스트 그림자 -->
    <filter id="shadow2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 배경 (iOS 라운드) -->
  <rect width="180" height="180" rx="40" fill="url(#bgGradient2)"/>

  <!-- 테두리 -->
  <rect x="5" y="5" width="170" height="170" rx="37" fill="none" stroke="#FF3D00" stroke-width="3" opacity="0.5"/>

  <!-- '밥' 문자 (그림자 효과) -->
  <text
    x="90"
    y="90"
    font-family="'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
    font-size="90"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    dominant-baseline="central"
    filter="url(#shadow2)"
  >밥</text>
</svg>
